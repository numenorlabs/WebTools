<!DOCTYPE html>
<html lang="en">
<head>
    <title>Window Size</title>
    <style>
        #label-track {
            display: flex;
            justify-content: start;
        }
        #window-size {
            background-color: lightskyblue;
            border-radius: 5px;
            padding: 5px;
            text-align: start;
            width: 225px;
        }
    </style>
    <script>
        function updateWindowSize() {
            document.getElementById("window-size").textContent =
                `Window size: ${window.innerWidth}px x ${window.innerHeight}px`;
        }

        document.addEventListener("DOMContentLoaded", function(){
            updateWindowSize();
            window.addEventListener("resize", updateWindowSize);
        });
    </script>
    <script>
        function changeAlignment() {
            const alignSequence = {"start":"center", "center":"end", "end":"start"}
            this.style.textAlign = alignSequence[window.getComputedStyle(this).textAlign];
            this.parentElement.style.justifyContent = alignSequence[window.getComputedStyle(this.parentElement).justifyContent];
        }

        document.addEventListener("DOMContentLoaded", function(){
            document.getElementById('window-size').addEventListener('click', changeAlignment);
        });
    </script>
</head>
<body>
    <div id="label-track"><div id="window-size">Loading window size...</div></div>
</body>
</html>
