<!DOCTYPE html>
<html lang="en">
<head>
    <title>Window Size</title>
    <style>
        #window-size {
            background-color: lightskyblue;
            border-radius: 5px;
            padding: 5px;
            text-align: start;
            width: 225px;
        }
    </style>
    <script>
        function updateWindowSize() {
            document.getElementById("window-size").textContent =
                `Window size: ${window.innerWidth}px x ${window.innerHeight}px`;
        }

        document.addEventListener("DOMContentLoaded", function(){
            updateWindowSize();
            window.addEventListener("resize", updateWindowSize);
        });
    </script>
</head>
<body>
    <div id="window-size">Loading window size...</div>
</body>
</html>
